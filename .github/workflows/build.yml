name: Build View621 (Cross-Platform)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore E6Viewer.csproj -r ${{ matrix.rid }}

      - name: Publish Windows (${{ matrix.platform }})
        run: dotnet publish E6Viewer.csproj -c Release -r ${{ matrix.rid }} -f net10.0-windows10.0.26100.0 --self-contained -o ./artifacts/windows-${{ matrix.platform }}

      - name: Upload Windows Artifact (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: View621-Windows-${{ matrix.platform }}
          path: ./artifacts/windows-${{ matrix.platform }}

  build-linux:
    name: Build Linux (Desktop Skia)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore E6Viewer.csproj -r linux-x64

      - name: Build Linux Desktop
        run: dotnet build E6Viewer.csproj -c Release -f net10.0-desktop

      - name: Publish Linux (Self-Contained x64)
        run: dotnet publish E6Viewer.csproj -c Release -r linux-x64 -f net10.0-desktop --self-contained -o ./artifacts/linux-x64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: View621-Linux-x64
          path: ./artifacts/linux-x64

  build-macos:
    name: Build macOS (Mac Catalyst)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Mac Catalyst Workload
        run: dotnet workload install maccatalyst

      - name: Restore Dependencies
        run: dotnet restore E6Viewer.csproj -r maccatalyst-arm64

      - name: Publish Mac Catalyst (arm64 Apple Silicon)
        run: dotnet publish E6Viewer.csproj -c Release -r maccatalyst-arm64 -f net10.0-maccatalyst --self-contained -p:EnableCodeSigning=false -p:PublishTrimmed=true -p:MtouchLink=None -o ./artifacts/macos-catalyst-arm64

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: View621-macOS-Catalyst-arm64
          path: ./artifacts/macos-catalyst-arm64
