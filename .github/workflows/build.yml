name: Build and Package View621

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            platform: x64
            exe_name: View621_x64
          - arch: arm64
            rid: win-arm64
            platform: ARM64
            exe_name: View621_arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore View621.csproj -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:PublishReadyToRun=false

      - name: Publish application
        run: >
          dotnet publish View621.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:PublishReadyToRun=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          --no-restore
          -o ./publish/${{ matrix.exe_name }}

      - name: Prepare Standalone Executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./artifacts" -Force
          Copy-Item "./publish/${{ matrix.exe_name }}/${{ matrix.exe_name }}.exe" "./artifacts/${{ matrix.exe_name }}.exe" -Force

      - name: Upload Single Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe_name }}
          path: ./artifacts/${{ matrix.exe_name }}.exe
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            ./release-artifacts/*.exe \
            --title "View621 ${{ github.ref_name }}" \
            --generate-notes
